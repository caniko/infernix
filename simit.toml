[ci]
runner = "ubuntu-24.04"
provider = "actions"
platform = "github"
runtime = "nix"
workspace = true
publish_crates = true
all_features = false
nix_builds = [".#headroom", ".#checks.x86_64-linux.headroom", ".#checks.x86_64-linux.headroom-runtime"]

[ci.nix_build]
max_parallel = 2
max_jobs = 1
cores = 2
timeout_minutes = 40
capture_results = true
artifact_retention_days = 30

[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"
system_runners = { x86_64-linux = "ubuntu-24.04" }
nix_builds = [
  ".#packages.x86_64-linux.infernix-lb",
  ".#packages.x86_64-linux.codex-acp",
  ".#packages.x86_64-linux.headroom",
  ".#packages.x86_64-linux.ponytail",
]

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "infernix"
token_secret = "ATTIC_TOKEN"

[ci.pages]
repo = "caniko/infernix"
canonical_domain = "infernix.tartanoglu.com"
