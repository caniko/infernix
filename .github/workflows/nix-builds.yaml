# Generated by simit. Manual edits will be reported as ci=drift.
name: Nix installable builds

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.ref_type == 'tag' && github.ref || format('refs/heads/{0}', github.event.pull_request.head.ref || github.ref_name) }}
  cancel-in-progress: true

jobs:
  build:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        installable:
          - ".#headroom"
          - ".#packages.x86_64-linux.infernix-image-run"
          - ".#checks.x86_64-linux.workload-fabric"
          - ".#checks.x86_64-linux.headroom"
          - ".#checks.x86_64-linux.headroom-runtime"
          - ".#checks.x86_64-linux.model-fetch"
          - ".#checks.x86_64-linux.model-lock"
          - ".#checks.x86_64-linux.colibri"
          - ".#checks.x86_64-linux.llama-swap-extra-files"
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare Nix build evidence
        env:
          INSTALLABLE: ${{ matrix.installable }}
        run: |
          SIMIT_NIX_BUILD_RESULTS="$RUNNER_TEMP/simit-nix-build-${{ strategy.job-index }}"
          printf '%s\n' "SIMIT_NIX_BUILD_RESULTS=$SIMIT_NIX_BUILD_RESULTS" >> "$GITHUB_ENV"
          mkdir -p "$SIMIT_NIX_BUILD_RESULTS"
          git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
          printf '%s\n' "$INSTALLABLE" > "$SIMIT_NIX_BUILD_RESULTS/installable"
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Build ${{ matrix.installable }}
        env:
          INSTALLABLE: ${{ matrix.installable }}
        run: |
          set -euo pipefail
          exec 3> >(tee "$SIMIT_NIX_BUILD_RESULTS/build.log" >&2)
          log_pid=$!
          status=0
          nix build --no-link --no-update-lock-file --max-jobs 1 --cores 2 --print-build-logs --json "$INSTALLABLE" 2>&3 | tee "$SIMIT_NIX_BUILD_RESULTS/result.json" || status=$?
          exec 3>&-
          wait "$log_pid"
          exit "$status"
      - name: Upload Nix build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2

        with:
          name: nix-build-${{ strategy.job-index }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/simit-nix-build-${{ strategy.job-index }}

  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Root Markdown nobody builds is documentation.
          classify() {
            case "$1" in
              */*) return 1 ;;
              README.md) return 1 ;;
              ?*.md) return 0 ;;
              *) return 1 ;;
            esac
          }
          code=true
          base=
          # A branch push compares with its fork point, not its previous push, which
          # may never have passed. Default-branch pushes qualify and publish every
          # revision, so they always run.
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$PR_BASE
          elif [ "$EVENT_NAME" = push ]; then
            case "$GITHUB_REF" in
              "refs/heads/$DEFAULT_BRANCH") ;;
              refs/heads/*) base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null) || base= ;;
            esac
          fi
          # A missing or unreachable base, or an empty diff, has nothing to classify.
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null && changed=$(git diff --no-renames --name-only "$base" HEAD --) && [ -n "$changed" ]; then
            code=false
            while IFS= read -r path; do
              classify "$path" || { code=true; break; }
            done <<< "$changed"
          fi
          printf 'code=%s\n' "$code" >> "$GITHUB_OUTPUT"
