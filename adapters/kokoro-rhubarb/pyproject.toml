[project]
name = "infernix-adapter-kokoro-rhubarb"
version = "0.1.0"
description = "Kokoro speech and Rhubarb lip sync for animation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "infernix-adapter",
  "kokoro==0.9.4",
  "torch==2.14.1",
]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"

[tool.uv.sources]
infernix-adapter = { path = "../common" }
torch = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
