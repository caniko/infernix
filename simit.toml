[ci]
runner = "ubuntu-24.04"
provider = "actions"
platform = "github"
runtime = "nix"
workspace = true
all_features = false
nix_builds = [".#packages.x86_64-linux.infernix-lb", ".#packages.x86_64-linux.codex-acp"]

[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"
system_runners = { x86_64-linux = "ubuntu-24.04" }

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "infernix"
token_secret = "ATTIC_TOKEN"

[ci.pages]
repo = "caniko/infernix"
canonical_domain = "infernix.tartanoglu.com"
