[package]
name = "infernix-workerd"
description = "Generic PostgreSQL-backed Infernix workload worker"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "infernix-workerd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
infernix-workload = { version = "0.1.0", path = "../infernix-workload", features = ["postgres"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
infernix-workload-testing = { version = "0.1.0", path = "../infernix-workload-testing" }
tokio = { version = "1", features = ["fs", "net", "sync"] }
