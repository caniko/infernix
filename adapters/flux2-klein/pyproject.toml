[project]
name = "infernix-adapter-flux2-klein"
version = "0.1.0"
description = "FLUX.2 klein 4B adapter for infernix animation (atlas ROCm, diffusers)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate==1.15.0",
  "diffusers==0.43.0",
  "infernix-adapter",
  "pillow>=12",
  "protobuf",
  "safetensors>=0.8",
  "sentencepiece",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "transformers==5.22.2",
]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"

[tool.uv.sources]
infernix-adapter = { path = "../common" }
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
