[package]
name = "infernix-workload"
description = "Generic durable workload-claiming and fencing primitives for Infernix"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"], optional = true }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"], optional = true }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }

[features]
default = []
# The async PostgreSQL ledger client shared by workerd and the hub pack.
postgres = ["dep:tokio", "dep:tokio-postgres"]

[dev-dependencies]
infernix-workload-testing = { version = "0.1.0", path = "../infernix-workload-testing" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
