[project]
name = "infernix-adapter-qwen3-tts"
version = "0.1.0"
description = "Qwen3-TTS CustomVoice adapter for infernix animation (atlas ROCm)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "infernix-adapter",
  "numpy>=2.0",
  "qwen-tts==0.1.1",
  "torch==2.14.1",
]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"

[tool.uv.sources]
infernix-adapter = { path = "../common" }
torch = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
