[ci]
runner = "ubuntu-24.04"
provider = "actions"
platform = "github"
runtime = "nix"
workspace = true
publish_crates = true
all_features = false
nix_builds = [".#headroom", ".#checks.x86_64-linux.headroom", ".#checks.x86_64-linux.headroom-runtime"]

[ci.nix_build]
max_parallel = 2
max_jobs = 1
cores = 2
timeout_minutes = 40
capture_results = true
artifact_retention_days = 30

[ci.pages]
repo = "caniko/infernix"
canonical_domain = "infernix.tartanoglu.com"
