[package]
name = "infernix-image-run"
description = "Host-local image execution runner for registered ComfyUI graphs and streaming adapters"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "infernix-image-run"
path = "src/bin/infernix-image-run.rs"

[[bin]]
name = "infernix-image-adapter"
path = "src/bin/infernix-image-adapter.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
