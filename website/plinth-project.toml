[[pages.sections]]
type = "feature_grid"
id = "overview"

[[pages.sections.features]]
title = "One namespace, one vendor switch"
description = "services.infernix.gpu picks AMD, NVIDIA or CPU and is consumed by the Ollama, llama-swap and ComfyUI modules, which handle the GPU override variable, visible device masking and package selection for you."

[[pages.sections.features]]
title = "Pinned, verified model fetches"
description = "modelFetch.jobs download a pinned Hugging Face revision, check each file's size and sha256, and publish the files with a ready manifest atomically; a re-run skips once that manifest verifies."

[[pages.sections.features]]
title = "Multi-model llama-swap"
description = "llama-swap sits in front of llama-server with per-model TTL and extra arguments, speculative decoding through draft models, flash-attention all-quants, and CPU microarchitecture tuning."

[[pages.sections.features]]
title = "Endpoints reach the agents"
description = "Declare each reachable backend once under Home Manager endpoints, and the opt-in modules render Goose providers, yeeHaw steeds, and OpenCode and Claude Code provider settings from that catalog."

[[pages.sections]]
type = "install"
id = "install"
heading = "Quick start"
intro = "Add the flake input, import the NixOS module, and describe the services you want. GPU packages come from your own nixpkgs instantiation, so rocmSupport or cudaSupport stays your decision rather than a flake-wide flag."
guide_href = "https://github.com/caniko/infernix"

[[pages.sections.primary_routes]]
label = "Flake input"
audience = "A flake that already builds your NixOS hosts"
command = 'infernix.url = "github:caniko/infernix";'
href = "https://github.com/caniko/infernix#quick-start"
recommended = true

