[project]
name = "infernix-adapter-qwen-image-edit-streaming"
version = "0.1.0"
description = "Qwen Image Edit 2511 BF16 streaming adapter (ROCm)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate==1.15.0",
  "diffusers==0.43.0",
  "infernix-adapter",
  "numpy==2.5.4",
  "pillow==13.0.0",
  "safetensors==0.8.0",
  "torch==2.14.1+rocm7.2",
  "torchvision==0.29.1+rocm7.2",
  "transformers==5.22.2",
]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
infernix-adapter = { path = "../common" }
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
